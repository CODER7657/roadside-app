name: mechanic_app
description: "Roadside mechanic app (PLAN.md §10, P2)."
publish_to: 'none'

# versionName+versionCode; bumped by the release PR (P2 guide §8).
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  lane_ui:
    path: ../packages/lane_ui
  roadside_core:
    path: ../packages/roadside_core
  # First-run state (language, onboarding, consent) on the device, as in customer_app.
  shared_preferences: ^2.5.5
  # 12.x: 13.x needs permission_handler_android 14 (compileSdk 37), which AGP 9.1 can't build.
  # Same pin as customer_app; move both up together.
  permission_handler: ^12.0.3
  # C9 Help: call / WhatsApp support, email the grievance officer.
  url_launcher: ^6.3.2
  # M1 registration: photos (same versions as customer_app) and the Firestore repository.
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    # ThreeUI horizon still (MIT, PLAN §6.17) for the splash, same as customer_app.
    - assets/images/
