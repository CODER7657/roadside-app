# Deploys Functions, Firestore/Storage rules, indexes and Hosting.
#   push to main (firebase/** changed) → roadside-dev
#   tag vX.Y.Z                         → roadside-prod. Only repo admins can create v* tags (tag ruleset), which is the
#                                        production gate. Required-reviewer environments need GitHub Enterprise for private repos.
# Auth uses Workload Identity Federation (no long-lived service-account keys in GitHub).
# Setup (P3): repo variables GCP_WIF_PROVIDER_DEV/PROD, GCP_DEPLOY_SA_DEV/PROD, FIREBASE_PROJECT_DEV/PROD, and on each
# environment (development / production) ADMIN_WEB_ENV: the admin panel's web config as JSON, shaped like
# admin_panel/env/example.json with USE_EMULATORS=false. Hosting targets and sites: firebase/.firebaserc.
name: Deploy Firebase

on:
  push:
    branches: [main]
    paths: ['firebase/**', 'admin_panel/**', 'packages/**']
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'prod') && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'prod') && 'production' || 'development' }}
    permissions:
      contents: read
      id-token: write
    env:
      IS_PROD: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.target == 'prod' }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve target
        id: t
        shell: bash
        run: |
          if [ "$IS_PROD" = "true" ]; then
            {
              echo "provider=${{ vars.GCP_WIF_PROVIDER_PROD }}"
              echo "sa=${{ vars.GCP_DEPLOY_SA_PROD }}"
              echo "project=${{ vars.FIREBASE_PROJECT_PROD }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "provider=${{ vars.GCP_WIF_PROVIDER_DEV }}"
              echo "sa=${{ vars.GCP_DEPLOY_SA_DEV }}"
              echo "project=${{ vars.FIREBASE_PROJECT_DEV }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Skip until Firebase is configured
        id: ready
        shell: bash
        run: |
          if [ -z "${{ steps.t.outputs.provider }}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Repo variables for Workload Identity are not set yet, deploy skipped."
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.ready.outputs.ok == 'true'
        with:
          workload_identity_provider: ${{ steps.t.outputs.provider }}
          service_account: ${{ steps.t.outputs.sa }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Install function deps
        if: steps.ready.outputs.ok == 'true' && hashFiles('firebase/functions/package-lock.json') != ''
        run: npm ci --prefix firebase/functions

      # The public legal pages (share site) must be final before they reach production (#55).
      - name: Legal pages have no placeholders (prod only)
        if: steps.ready.outputs.ok == 'true' && env.IS_PROD == 'true'
        shell: bash
        run: bash tool/check_legal_placeholders.sh

      # Hosting serves admin_panel/build/web (firebase.json, target "admin").
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.ready.outputs.ok == 'true'
        with:
          channel: stable
          cache: true

      - name: Build admin panel
        if: steps.ready.outputs.ok == 'true'
        working-directory: admin_panel
        shell: bash
        env:
          ADMIN_WEB_ENV: ${{ vars.ADMIN_WEB_ENV }}
        run: |
          if [ -z "$ADMIN_WEB_ENV" ]; then echo "::error::Set the ADMIN_WEB_ENV variable on this environment."; exit 1; fi
          printf '%s' "$ADMIN_WEB_ENV" > env/deploy.json
          entry=lib/main_dev.dart; [ "$IS_PROD" = "true" ] && entry=lib/main_prod.dart
          flutter pub get
          flutter build web --release --no-web-resources-cdn -t "$entry" --dart-define-from-file=env/deploy.json
          rm env/deploy.json

      - name: firebase deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: firebase
        run: npx --yes firebase-tools@latest deploy --non-interactive --project "${{ steps.t.outputs.project }}" --only functions,firestore,storage,hosting
