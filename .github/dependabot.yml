# Weekly dependency updates, grouped so they arrive as one PR per ecosystem.
# TODO (P3 · Ayush): uncomment the pub/npm entries once those folders exist (day 1–2);
# Dependabot reports an error for directories that don't exist yet.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

