# Weekly dependency updates. Minor and patch updates arrive as one grouped PR per ecosystem; a major
# upgrade (Riverpod, go_router, Firebase) arrives as its own PR, for its folder's owner to review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: pub
    directories: ['/customer_app', '/mechanic_app', '/admin_panel', '/packages/lane_ui', '/packages/roadside_core']
    schedule: { interval: weekly, day: monday }
    groups: { pub: { patterns: ['*'], update-types: ['minor', 'patch'] } }
    commit-message: { prefix: chore }
    ignore:
      # 13+ pulls in permission_handler_android 14, which needs compileSdk 37 (declined in #163, #164)
      - { dependency-name: permission_handler, update-types: ['version-update:semver-major'] }

  - package-ecosystem: npm
    directories: ['/firebase/functions', '/firebase/rules_tests', '/firebase/seed', '/tool/admin']
    schedule: { interval: weekly, day: monday }
    groups: { npm: { patterns: ['*'], update-types: ['minor', 'patch'] } }
    commit-message: { prefix: chore }
    ignore:
      # Must match the Node version the code runs on ("engines": node 22), not the newest (declined in #161)
      - { dependency-name: '@types/node', update-types: ['version-update:semver-major'] }
