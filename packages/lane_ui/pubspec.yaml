name: lane_ui
description: "Lane, the design system shared by the customer app, mechanic app and admin panel (PLAN.md §6)."
version: 0.1.0-dev.8
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  animations: ^3.0.0
  battery_plus: ^7.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  intl: ^0.20.3
  screen_brightness: ^2.1.11
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  alchemist: ^0.14.0

flutter:
  generate: true

  # Licence texts shown on the apps' "Open-source licenses" screen (LaneLicenses.register).
  assets:
    - assets/licenses/
    # Phosphor duotone icons (MIT): the 23 Lane pictograms + UI glyphs (lane_icons.dart).
    - assets/icons/

  # Bundled, never fetched at runtime (PLAN §3, §6.8). Apps reference them through
  # LaneFonts, which passes `package: 'lane_ui'`. Onest, JetBrains Mono and Anek are
  # variable fonts: weights come from `fontVariations`, set by LaneText.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: AnekDevanagari
      fonts:
        - asset: assets/fonts/AnekDevanagari-Variable.ttf
    - family: AnekGujarati
      fonts:
        - asset: assets/fonts/AnekGujarati-Variable.ttf
