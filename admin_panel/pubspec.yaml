name: admin_panel
description: "Roadside admin panel (PLAN.md §10 admin, §12.11, P3)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  lane_ui:
    path: ../packages/lane_ui
    version: 0.1.0-dev.15
  roadside_core:
    path: ../packages/roadside_core
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  url_launcher: ^6.3.2
  firebase_app_check: ^0.4.8

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    # ThreeUI Warp Field still (MIT, PLAN §6.17), behind A0 sign-in.
    - assets/images/
